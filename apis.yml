apis:
- aid: roboflow:inference
  name: Roboflow Inference Server API
  description: The OpenAPI-described inference surface of the Roboflow platform. Runs trained Roboflow models
    plus a catalog of foundation models — CLIP and Perception Encoder embeddings, Grounding DINO, YOLO-World
    and OWLv2 open-vocabulary detection, SAM/SAM2/SAM3 segmentation, DocTR/EasyOCR/TrOCR/PP-OCR text
    extraction, depth estimation, and large multimodal models — over HTTP. The same specification is served
    by the hosted serverless endpoints and by a self-hosted Docker inference server.
  humanURL: https://docs.roboflow.com/deployment/roboflow-cloud/serverless-api
  baseURL: https://serverless.roboflow.com
  tags:
  - Inference
  - Computer Vision
  - Object Detection
  - Segmentation
  - OCR
  properties:
  - type: OpenAPI
    url: openapi/roboflow-inference-openapi.json
  - type: Overlay
    url: overlays/roboflow-inference-overlay.yaml
  - type: Documentation
    url: https://docs.roboflow.com/deployment/roboflow-cloud/serverless-api
- aid: roboflow:rest
  name: Roboflow REST API
  description: The authoritative management interface to the Roboflow platform — workspaces, projects,
    dataset versions, image upload and annotation, training jobs, model evaluations, Workflows, folders,
    vision events and trash. Every platform feature ships here first; the Python SDK and CLI both call it.
    Resources are addressed hierarchically as /:workspace/:project/:version. Authenticated with a
    workspace-scoped API key; long-running operations return a task id to poll.
  humanURL: https://docs.roboflow.com/reference/platform/rest-api
  baseURL: https://api.roboflow.com
  tags:
  - Platform
  - Datasets
  - Model Training
  - Workflows
  properties:
  - type: Documentation
    url: https://docs.roboflow.com/reference/platform/rest-api
  - type: Authentication
    url: https://docs.roboflow.com/reference/platform/rest-api/authenticate-with-the-rest-api
  - type: ErrorCodes
    url: https://docs.roboflow.com/reference/errors-and-status-codes
- aid: roboflow:mcp
  name: Roboflow MCP Server
  description: Roboflow's hosted, remote Model Context Protocol server. Exposes 67 tools across agent chat,
    projects, images, annotation, batches, dataset versions, model training, model evaluations, Workflows,
    edge devices and streams, and Roboflow Universe search. Authenticated with OAuth 2.1 (authorization code
    + PKCE) against app.roboflow.com with RFC 7591 dynamic client registration — no API key required.
  humanURL: https://docs.roboflow.com/agents/agents/mcp-server
  baseURL: https://mcp.roboflow.com/mcp
  tags:
  - MCP
  - Agents
  - Computer Vision
  properties:
