aid: roboflow
name: Roboflow
description: Roboflow is a computer vision platform used by over one million engineers to annotate images,
  train custom models, and deploy them to production from the cloud to the edge. The platform spans dataset
  management and AI-assisted labeling, model training (RF-DETR, YOLO and NAS architectures), evaluation with
  mAP and confusion-matrix analysis, and low-code Workflows that compose models with logic and visualization
  into deployable pipelines. Deployment options include a serverless hosted inference API, dedicated
  deployments, batch processing, self-hosted Docker inference servers, in-browser inference, and managed edge
  devices. Roboflow Universe publishes a large open library of community datasets and models. Developers
  reach the platform through a REST API, a Python SDK and CLI, an OpenAPI-described inference server, and a
  hosted OAuth-protected MCP server paired with first-party Agent Skills.
