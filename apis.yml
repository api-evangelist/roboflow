apis:
- aid: roboflow:rest
  name: Roboflow REST API
  description: >-
    The authoritative management interface to the Roboflow platform — workspaces, projects, dataset versions,
    image upload and annotation, training jobs, model evaluations, Workflows, folders, vision events and
    trash. Every platform feature ships here first; the Python SDK and CLI both call it. Resources are
    addressed hierarchically as /:workspace/:project/:version. Authenticated with a workspace-scoped API
    key; long-running operations return a task id to poll.
  humanURL: https://docs.roboflow.com/reference/platform/rest-api
  baseURL: https://api.roboflow.com
  tags:
  - Platform
  - Datasets
  - Model Training
  - Workflows
  properties:
  - type: Documentation
    url: https://docs.roboflow.com/reference/platform/rest-api
  - type: Authentication
    url: https://docs.roboflow.com/reference/platform/rest-api/authenticate-with-the-rest-api
  - type: ErrorCodes
    url: https://docs.roboflow.com/reference/errors-and-status-codes
- aid: roboflow:mcp
  name: Roboflow MCP Server
  description: >-
    Roboflow's hosted, remote Model Context Protocol server. Exposes 67 tools across agent chat, projects,
    images, annotation, batches, dataset versions, model training, model evaluations, Workflows, edge
    devices and streams, and Roboflow Universe search. Authenticated with OAuth 2.1 (authorization code
    + PKCE) against app.roboflow.com with RFC 7591 dynamic client registration — no API key required.
  humanURL: https://docs.roboflow.com/agents/agents/mcp-server
  baseURL: https://mcp.roboflow.com/mcp
  tags:
  - MCP
  - Agents
  - Computer-Vision
  tags_raw:
  - MCP
  - Agents
  - Computer Vision
