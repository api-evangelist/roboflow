notes: 'Roboflow runs two non-overlapping API surfaces. The published OpenAPI covers only the Inference Server (detect/infer/serverless.roboflow.com)
  — model execution primitives. The MCP server almost entirely fronts the management REST API at api.roboflow.com, which
  has no public machine-readable contract. The result is a near-disjoint crosswalk: one real binding, and two large sets
  that each surface capability the other does not.'
