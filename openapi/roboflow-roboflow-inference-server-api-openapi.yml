components:
  schemas:
    MultiLabelClassificationInferenceResponse:
      properties:
        visualization:
          anyOf:
          - type: string
          - type: 'null'
          title: Visualization
          description: Base64 encoded string containing prediction visualization image data
        inference_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Inference Id
          description: Unique identifier of inference
        frame_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Frame Id
          description: The frame id of the image used in inference if the input was a video
        time:
          anyOf:
          - type: number
          - type: 'null'
          title: Time
          description: The time in seconds it took to produce the predictions including image preprocessing
        image:
          anyOf:
          - items:
              $ref: '#/components/schemas/InferenceResponseImage'
            type: array
          - $ref: '#/components/schemas/InferenceResponseImage'
          title: Image
        predictions:
          additionalProperties:
            $ref: '#/components/schemas/MultiLabelClassificationPrediction'
          type: object
          title: Predictions
        predicted_classes:
          items:
            type: string
          type: array
          title: Predicted Classes
          description: The list of predicted classes
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
          description: Identifier of parent image region. Useful when stack of detection-models is in
            use to refer the RoI being the input to inference
      type: object
      required:
      - image
      - predictions
      - predicted_classes
      title: MultiLabelClassificationInferenceResponse
      description: "Multi-label Classification inference response.\n\nAttributes:\n    predictions (Dict[str,\
        \ inference.core.entities.responses.inference.MultiLabelClassificationPrediction]): Dictionary\
        \ of multi-label classification predictions.\n    predicted_classes (List[str]): The list of predicted\
        \ classes."
    Point-Output:
      properties:
        x:
          type: number
          title: X
          description: The x-axis pixel coordinate of the point
        y:
          type: number
          title: Y
          description: The y-axis pixel coordinate of the point
      type: object
      required:
      - x
      - y
      title: Point
      description: "Point coordinates.\n\nAttributes:\n    x (float): The x-axis pixel coordinate of the\
        \ point.\n    y (float): The y-axis pixel coordinate of the point."
    ObjectDetectionInferenceResponse:
      properties:
        visualization:
          anyOf:
          - type: string
          - type: 'null'
          title: Visualization
          description: Base64 encoded string containing prediction visualization image data
        inference_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Inference Id
          description: Unique identifier of inference
        frame_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Frame Id
          description: The frame id of the image used in inference if the input was a video
        time:
          anyOf:
          - type: number
          - type: 'null'
          title: Time
          description: The time in seconds it took to produce the predictions including image preprocessing
        image:
          anyOf:
          - items:
              $ref: '#/components/schemas/InferenceResponseImage'
            type: array
          - $ref: '#/components/schemas/InferenceResponseImage'
          title: Image
        predictions:
          items:
            $ref: '#/components/schemas/ObjectDetectionPrediction'
          type: array
          title: Predictions
      type: object
      required:
      - image
      - predictions
      title: ObjectDetectionInferenceResponse
      description: "Object Detection inference response.\n\nAttributes:\n    predictions (List[inference.core.entities.responses.inference.ObjectDetectionPrediction]):\
        \ List of object detection predictions."
    InstanceSegmentationPrediction:
      properties:
        x:
          type: number
          title: X
          description: The center x-axis pixel coordinate of the prediction
        y:
          type: number
          title: Y
          description: The center y-axis pixel coordinate of the prediction
        width:
          type: number
          title: Width
          description: The width of the prediction bounding box in number of pixels
        height:
          type: number
          title: Height
          description: The height of the prediction bounding box in number of pixels
        confidence:
          type: number
          title: Confidence
          description: The detection confidence as a fraction between 0 and 1
        class:
          type: string
          title: Class
          description: The predicted class label
        class_id:
          type: integer
          title: Class Id
          description: The class id of the prediction
        detection_id:
          type: string
          title: Detection Id
          description: Unique identifier of detection
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
          description: Identifier of parent image region
        class_confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Class Confidence
          description: The class label confidence as a fraction between 0 and 1
        points:
          items:
            $ref: '#/components/schemas/Point-Output'
          type: array
          title: Points
          description: The list of points that make up the instance polygon
        mask_format:
          type: string
          const: polygon
          title: Mask Format
          description: Type of mask format
          default: polygon
      type: object
      required:
      - x
      - y
      - width
      - height
      - confidence
      - class
      - class_id
      - points
      title: InstanceSegmentationPrediction
    ClassificationPrediction:
      properties:
        class:
          type: string
          title: Class
          description: The predicted class label
        class_id:
