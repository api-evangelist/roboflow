  Server OpenAPI and describes request/response payload shapes, not persisted platform entities.
platform_entities:
- entity: Workspace
  path: /:workspace
  description: Top-level tenant. Owns projects, folders, team members, API keys, devices and billing.
  relationships:
  - kind: has_many
    to: Project
    via: projects
  - kind: has_many
    to: Folder
    via: groups
  - kind: has_many
    to: Workflow
    via: workflows
  - kind: has_one
    to: Trash
    via: trash
- entity: Project
  path: /:workspace/:project
  description: A computer vision project — detection, classification, segmentation or keypoint. Owns images, annotations,
    batches and dataset versions.
  relationships:
  - kind: belongs_to
    to: Workspace
    via: workspace
  - kind: has_many
    to: Version
    via: versions
  - kind: has_many
    to: Image
    via: images
  - kind: has_many
    to: Batch
    via: batches
  - kind: has_many
    to: AnnotationJob
    via: annotation_jobs
- entity: Version
  path: /:workspace/:project/:version
  description: An immutable dataset version with its splits, preprocessing and augmentation settings. A version can carry
    one or more trained models.
  relationships:
  - kind: belongs_to
    to: Project
    via: project
  - kind: has_many
    to: Model
    via: models
  - kind: has_many
    to: Export
    via: formats
- entity: Export
  path: /:workspace/:project/:version/:format
  description: A dataset version rendered into an export format (coco, yolov8, jsonl, …).
  relationships:
  - kind: belongs_to
    to: Version
    via: version
- entity: Model
  description: A trained model produced by a training job on a dataset version; deployable to serverless, dedicated,
    self-hosted or edge targets.
  relationships:
  - kind: belongs_to
    to: Version
    via: version
  - kind: has_many
    to: ModelEvaluation
    via: evals
  - kind: belongs_to
    to: TrainingJob
    via: training
- entity: ModelEvaluation
  description: Evaluation of a model — mAP by split, confusion matrix, confidence sweep, per-class performance, vector
    analysis.
  relationships:
  - kind: belongs_to
    to: Model
    via: model
- entity: Image
  description: An image in a project, with tags and annotations, arriving through an upload batch.
  relationships:
  - kind: belongs_to
    to: Project
    via: project
  - kind: has_many
    to: Annotation
    via: annotations
  - kind: belongs_to
    to: Batch
    via: batch
- entity: Annotation
  description: Labels attached to an image (XML, JSON or text).
  relationships:
  - kind: belongs_to
    to: Image
    via: image
- entity: Batch
  description: An upload batch grouping images for labeling.
  relationships:
  - kind: belongs_to
    to: Project
    via: project
  - kind: has_many
    to: Image
    via: images
  - kind: has_many
    to: AnnotationJob
    via: jobs
- entity: AnnotationJob
  description: Assignment of a batch to a labeler and a reviewer, with a review workflow.
  relationships:
  - kind: belongs_to
    to: Batch
    via: batch
- entity: Workflow
  path: /:workspace/workflows/:workflow
  description: A low-code pipeline composing model steps, logic and visualization blocks into one deployable unit.
  relationships:
  - kind: belongs_to
    to: Workspace
    via: workspace
  - kind: has_many
    to: WorkflowBlock
    via: steps
- entity: Folder
  path: /:workspace/groups
  description: Project folder used to group projects and scope billing.
  relationships:
  - kind: belongs_to
    to: Workspace
    via: workspace
  - kind: has_many
    to: Project
    via: projects
- entity: Device
  description: A registered edge device with runtime configuration, telemetry, logs and video streams.
  relationships:
  - kind: belongs_to
    to: Workspace
    via: workspace
  - kind: has_many
    to: Stream
    via: streams
  - kind: has_one
    to: DeviceConfig
    via: config
- entity: AsyncTask
  description: Handle returned by long-running operations (project fork, zip upload, export); polled for running/completed/failed.
  relationships: []
